# Uploads software bill-of-materials (SBOMs) to the Eclipse SBOM registry https://sbom.eclipse.org.
name: eclipse-sboms

on:
  push:
    branches: ['master']
    tags: [v*]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-sbom:
    name: generate-sbom
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for the upload to the Eclipse PIA
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # jgitver derives the version from git tags
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Generate SBOM
        # one aggregate CycloneDX 1.6 SBOM of all published modules, configured in pom.xml
        run: |
          mvn -B -q -DskipTests -Dmaven.javadoc.skip=true -Dmaven.source.skip=true \
            package cyclonedx:makeAggregateBom

      - name: Read version
        id: version
        run: |
          VERSION="$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout | tail -n1 | tr -d '[:space:]')"
          echo "Product version is: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: sbom-proj4j
          path: target/bom.json

      - name: Upload SBOM
        uses: eclipse-csi/workflows/upload-sbom@d2d3dbbc0a1907f41892c1698b3c6353235c87cb # there are no tags, this is main as of 2026-11-18
        with:
          sbom-file: ./target/bom.json
          product-name: proj4j
          product-version: ${{ steps.version.outputs.version }}
