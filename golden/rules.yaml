    match:
      classifications: [CHANGED]
      sections: [REG]
      keys: ["esri:2056", "esri:21780", "esri:21781", "esri:23700"]
      status_from: "EXC:org.locationtech.proj4j.ProjectionException"
      status_to: "OK"
    expect:
      dimensions: [fx, fy, fz, ix, iy, iz]
      allow_status_change: true
      allow_inside_change: true
      allow_nonfinite: true

