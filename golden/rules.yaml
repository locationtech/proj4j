  - id: PARSE-RF-IN-WORLD-DICTIONARY
    status: active
    expires: 2027-06-30
    # PINNED at 5 -- world:palestine's five probes -- measured 2026-08-01 on a frozen /tmp
    # snapshot, matching the 5 previously observed here. The tmerc kernel is still being rewritten,
    # which is what the 1e3 magnitude FLOOR below is for: it makes this rule decline, rather than
    # absorb, any sub-kilometre tmerc movement on these rows. The floor is what makes the count safe
    # to pin now instead of waiting for that stream; the observed movements are 6.6e23..5.7e205.
    expected_rows: 5
    reason: |
      CORRECTION TO A LOAD-BEARING CLAIM. PARSE-RF-F-TRANSPOSED above, and golden/README.md's
      "The synthetic matrix is not optional" section, both state that `+rf=` appears in NO registry
      dictionary and NO test CSV -- "zero occurrences, verified by grep" -- and conclude that the
      synthetic rows are "the ONLY baseline rows this fix can move". The CSV half is right. The
      dictionary half is wrong, and the reason is instructive: the dictionaries write parameters
      WITHOUT the leading `+`, so a grep for `+rf=` finds nothing while a grep for `rf=` finds two:

          epsg/src/main/resources/proj4/nad/world:96   <palestine>  proj=tmerc a=6378300.79 rf=293.488307656
          epsg/src/main/resources/proj4/nad/world:110  <malay>      proj=omerc a=6377295.66402 rf=300.8017

      The synthetic matrix is still not optional -- it is what puts `+rf` in front of six different
      host projections, and world:malay is unreachable in 1.4.3 for an unrelated reason -- but
      PARSE-RF-F-TRANSPOSED is scoped `sections: [SYN]` and therefore left world:palestine's 5 rows
      unexplained. This rule claims them.

      1.4.3's setRF(293.488307656) computed es = rf * (2 - rf) = -85,540, so `e` was NaN. The
      damage is on the scale that number implies: probe 0 (the CRS origin, lat_0=31d44'2.749"N
      lon_0=35d12'43.490"E) round-tripped to latitude -3.3e205 degrees where the definition's own
      origin latitude is 31.734; probes 3 and 4 had eastings and northings around 1.3e24 m. The
      current values are ordinary Palestine Grid coordinates.

      world:malay is claimed earlier, by PARSE-NO-KEYWORD-ALLOWLIST, because its 1.4.3 status was
      an UnsupportedParameterException on +rot_conv -- so it never got as far as the ellipsoid and
      its baseline row is all-NaN. That rule makes no claim about the value it now produces; this
      note is here so the +rf dependency is not lost.

      MAGNITUDE FLOOR OF 1e3, AND WHY IT MATTERS. world:palestine is a tmerc, and the transverse
      Mercator kernel is being rewritten concurrently. A rule with no floor would silently absorb
      any future sub-kilometre tmerc movement on these five rows. The observed movements are
      6.6e23 .. 5.7e205 in the raw column units (metres for fx/fy, degrees for the always-degrees
      ix/iy), i.e. 20 orders of magnitude clear of the floor, so the floor costs nothing and buys a
      rule that declines -- and re-reports -- anything that is not this defect.
    match:
      classifications: [CHANGED]
      sections: [REG]
      keys: ["world:palestine"]
      params_present: [rf]
    expect:
      dimensions: [fx, fy, fz, ix, iy, iz]
      allow_nonfinite: true
      magnitude: {min: 1.0e3, max: 1.0e250}

  # ---------------------------------------------------------------------------------------------
  - id: PARSE-FIRST-MATCH-WINS
    status: active
    expires: 2027-06-30
    # PINNED at 71, measured 2026-08-01 on a frozen /tmp snapshot, matching the 71 previously
    # observed. The row set is the four duplicate-key modifier slugs (ellps_clrk66, units_us_ft,
    # units_km, x_0_y_0) over the six hosts, LESS the `mod/aea/*` share claimed earlier by
    # PROJ-AEA-SPHERICAL-INVERSE -- that cross-rule dependency is by design and is why this number
    # is not 4 x 6 x 5. If PROJ-AEA-SPHERICAL-INVERSE is ever reordered after this rule, this count
    # rises and that one falls; fix the ORDER, never the predicates.
    expected_rows: 71
    reason: |
      parser/Proj4Parser.java:560-562 now keeps the FIRST occurrence of a duplicated parameter --
      `if (!params.containsKey(key)) params.put(key, value)`. 1.4.3 put every token into a HashMap
      unconditionally and so kept the LAST. PROJ keeps the first: 9.8.1:src/init.cpp appends tokens
      to a paralist in order and pj_param's lookup returns the first match, which is why upstream
      documents later duplicates as inert.

      The synthetic matrix probes this on purpose. Its canonical parameter set is
      `+ellps=GRS80 +lat_0=45 +lon_0=10 +lat_1=30 +lat_2=60 +x_0=0 +y_0=0 +units=m` and the
      modifier is APPENDED, so exactly four of the 47 modifiers collide with a canonical key:
      ellps_clrk66, units_us_ft, units_km and x_0_y_0. Those four, over the six hosts, are this
      rule's entire row set.

      THE MECHANISM IS CONFIRMED BY EXACT ARITHMETIC, not by inspection:
        * mod/*/units_km   -- fx and fy are current = baseline * 1000 EXACTLY on every row.
        * mod/*/units_us_ft -- current = baseline * 0.304800609601219 exactly, which is
          1200/3937, the US survey foot. 1.4.3 emitted feet, having taken the appended
          `+units=us-ft`; the current build emits metres, taking the canonical `+units=m`.
        * mod/*/x_0_y_0    -- fx moves by exactly -500000 and fy by exactly -1000000 on every
          row: the canonical `+x_0=0 +y_0=0` now wins over the appended
          `+x_0=500000 +y_0=1000000`.
        * mod/*/ellps_clrk66 -- 18 .. 321 m, and the current values equal the corresponding
          GRS80 rows of the other modifiers to the last digit, so the ellipsoid in force changed
          from clrk66 to the canonical GRS80.

      WHAT THIS RULE DOES NOT VOUCH FOR. On the tmerc and utm hosts a second, much smaller
      movement is superimposed: the ratios come out as 999.999999999522 rather than 1000 and the
      inverse latitude moves by ~1e-7 degrees. That is the transverse-Mercator kernel rewrite, it
      is eight significant digits below the structural change, and it is the same drift
      NUM-KARNEY-LATITUDE-CORE claims on rows where nothing structural happened. This rule
      explains the unit and offset flip; it says nothing about that residue, and the residue is
      small enough that it cannot be what makes a row match.

      Units: fx/fy are the target CRS's units, which for these rows is the whole point -- the
      baseline is in feet or kilometres and the current row is in metres. See the units warning at
      the top of this file. The floor of 1.0 excludes pure-drift rows so they stay with the
      numerical-core rule where they belong.
    match:
      classifications: [CHANGED]
      sections: [SYN]
      keys: ["mod/*/ellps_clrk66", "mod/*/units_us_ft", "mod/*/units_km", "mod/*/x_0_y_0"]
    expect:
      dimensions: [fx, fy, fz, ix, iy, iz]
      magnitude: {min: 1.0, max: 1.0e8}

