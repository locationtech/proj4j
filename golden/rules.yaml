    expected_rows: 20
    reason: |
      FOUR REAL, HEAVILY USED CRS THAT 1.4.3 COULD NOT CONSTRUCT AT ALL, and the count is small
      only because the guard was so specific.

      `ObliqueMercatorProjection.initialize()` in 1.4.3 rejected the azimuth form whenever
      `|alpha| - pi/2 <= TOL`, throwing `ProjectionException("Obl 1")` -- message text `Obl 1`,
      nothing more. `+alpha=90` is exactly that case, and it is what the Swiss and Hungarian
      oblique Mercators use:

        esri:2056   CH1903+ / LV95   +proj=omerc +lat_0=46.95240555555556 +alpha=90 +ellps=bessel
        esri:21780  CH1903  / LV03   ... +pm=bern
        esri:21781  CH1903  / LV03   ... +x_0=600000 +y_0=200000
        esri:23700  HD72    / EOV    +lat_0=47.14439372222222 +alpha=90 +ellps=GRS67 +k=0.99993

      UPSTREAM HAS NO SUCH GUARD, verified by reading the file rather than the docs.
      9.8.1:src/projections/omerc.cpp:134-146 takes the azimuth branch as soon as `+alpha` or
      `+gamma` is present and validates NOTHING in it: the only rejections in `omerc_setup` are in
      the two-point branch (`|lat_1| > 90 - TOL` at :158, `|lat_2| > 90 - TOL` at :164,
      `|lat_1 - lat_2| <= TOL` at :170) plus the shared `|lat_0| = 90` test. `alpha = 90 deg` is a
      perfectly well-posed Hotine oblique Mercator; the 1.4.3 guard was a transcription of the
      two-point preconditions onto the wrong branch.

      Every claimed row is `EXC:ProjectionException -> OK` with the baseline message `crs-tgt: Obl
      1` and an all-NaN baseline side, so no numeric value is being absorbed. What the coordinates
      are now worth is gie's question, and the omerc kernel is being rewritten concurrently --
      hence `status_from`/`status_to` are both pinned, so the moment one of these four stops
      producing a coordinate this rule declines it and the row returns to UNEXPLAINED instead of
