      Proj4VariousTest.testRawEllipse start failing more accurately (latitude moved ~292 m and a
      spurious z = 699 m appeared). proj4j was getting PROJ's answer here by accident, via one bug
      cancelling another -- so expect these two rules' counts to move together.
    match:
      classifications: [CHANGED]
      sections: [PAIR]
      keys: ["t0*/*", "t*0/*"]
    expect:
      dimensions: [fx, fy, fz, ix, iy, iz]
      allow_nonfinite: true

