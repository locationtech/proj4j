    expires: 2027-06-30
    # PINNED at 51 = the `OK -> OK` remainder of the polyconic set on REG and SYN: 11 registry
    # keys (epsg:29100 29101 5472 5530 5880, esri:102766 29100 54021 65061 65161, nad27:5400)
    # and `SYN proj/poly`, at the probes that converged in 1.4.3. Six further rows are the
    # probe-0 status transitions claimed by PROJ-POLYCONIC-INVERSE-CONVERGES above.
    #
    # SECTION CSV IS DELIBERATELY EXCLUDED and the 5 `proj4-epsg.csv` polyconic rows are left
    # UNEXPLAINED. That file is inside the reserved 1,163-row re-pin (golden/README.md,
    # "Reserved for the transverse-Mercator stream"), which is still awaiting a user decision,
    # so its rows are still moving and nothing in this pass claims any of them.
    # RE-PINNED 2026-08-01 by the FAILCLOSED-NAD27-OUTSIDE-GRID-REPORTED stream, which is
    # ordered first in this file. 8 of this rule's rows are +datum=NAD27 CRS whose transform
    # now raises COORDINATE_OUTSIDE_GRID instead of returning a coordinate, so they have no
    # numeric movement left for this rule to describe and that rule claims them. The mechanism
    # this rule states is unchanged and is still true of the 43 that remain; only the
    # population it applies to shrank. Verified on a frozen A/B, and the arithmetic is
    # itemised in that rule's reason.
    expected_rows: 43
    reason: |
      The `OK -> OK` half of the polyconic fix whose inverse half is
      PROJ-POLYCONIC-INVERSE-CONVERGES above. Three defects, each carrying its own upstream
      line reference in `proj/PolyconicProjection.java`:

        * FORWARD, `9.8.1:poly.cpp:37-40` -- `lam` is scaled by `sin(phi)` FIRST and both the
          easting and the northing are then built from the scaled value.
        * INVERSE, spherical, `9.8.1:poly.cpp:112` -- upstream MUTATES `xy.y` to
          `phi0 + xy.y` and uses the mutated value both as the iteration seed and inside `B`.
          proj4j tested the sum and then reverted to the raw northing, so the spherical inverse
          ignored `+lat_0` entirely.
        * INVERSE, ellipsoidal, `9.8.1:poly.cpp:88` -- the `one_es / mlp^3` term, quoted in
          full under PROJ-POLYCONIC-INVERSE-CONVERGES.

      Observed movement 0.258 m .. 1.17e4 m, in metres (`poly` is a projected target
      throughout; the `ix`/`iy` columns of these rows also move, in degrees, and by up to 43
      degrees on the synthetic key where the inverse was simply wrong). `SYN proj/poly` probe 1
      is the clearest single row: `fx` -2,033,409.06 -> -2,035,112.75 and
      `iy` -12.65005 -> 30 -- the committed probe latitude, exactly, where 1.4.3 answered 42
      degrees away.

      SCOPED BY `tgt_proj: [poly]` RATHER THAN BY KEY, deliberately, because the mechanism is a
      property of the projection and every `+proj=poly` target in REG and SYN is affected --
      the same argument PROJ-EQC-EQDC-SINU-REGISTRY-ROWS makes. Band 1e-1 .. 1e5: the floor is
      three orders above the sub-millimetre residue that sits on everything in this suite, so
      this rule cannot absorb drift, and the ceiling is one order above the largest observed
      movement.

      IT VOUCHES FOR NO COORDINATE. Whether the polyconic is now RIGHT is gie's question, per
      this file's opening policy.
    match:
      classifications: [CHANGED]
      sections: [REG, SYN]
      tgt_proj: [poly]
      status_from: "OK"
      status_to: "OK"
    expect:
      dimensions: [fx, fy, fz, ix, iy, iz]
      magnitude: {min: 1.0e-1, max: 1.0e5}

  # ---------------------------------------------------------------------------------------------
  - id: PROJ-TMERC-PODER-ENGSAGER-DEFAULT
    status: active
    expires: 2027-06-30
    # PINNED at 14724, and this is the largest claim in the file by two orders of magnitude, so
    # the pin matters more here than anywhere else. It decomposes as 14,723 REG + 1 SYN. It is
    # NOT structural -- it is every REG/SYN transverse-Mercator row whose movement lands in the
    # band, and which rows those are depends on how far each CRS's probes fall from its own
    # central meridian. Two things will move it and both should be looked at rather than
    # re-pinned reflexively:
    #   * a further change to the transverse-Mercator kernel, which is the point of the pin;
    #   * anything that moves a datum-shifted tmerc/utm row ACROSS the 1 cm ceiling, in either
    #     direction. 380 REG tmerc/utm rows carrying `datum=NAD27` already sit ABOVE the
    #     ceiling, on the NADCON grid shift, and are deliberately not claimed here.
    #
    # Measured 2026-08-01 (late triage) on a frozen /tmp snapshot with one live stream
    # (`BasicCoordinateTransform` plus three test files) excluded by the freeze. That stream's
    # open `InventedHeightTest` work keys on `Double.isNaN(src.z)`, and `GoldenGenerator.java:273`
    # sets `in.z = 0.0` unconditionally, so it cannot reach these rows -- checked, because a pin
    # this large deserves to know what can invalidate it.
    # RE-PINNED 2026-08-01 by the FAILCLOSED-NAD27-OUTSIDE-GRID-REPORTED stream, which is
    # ordered first in this file. 686 of this rule's rows are +datum=NAD27 CRS whose transform
    # now raises COORDINATE_OUTSIDE_GRID instead of returning a coordinate, so they have no
    # numeric movement left for this rule to describe and that rule claims them. The mechanism
    # this rule states is unchanged and is still true of the 14038 that remain; only the
    # population it applies to shrank. Verified on a frozen A/B, and the arithmetic is
    # itemised in that rule's reason.
    expected_rows: 14038
    reason: |
      PROJ 9.8.1 RUNS PODER/ENGSAGER FOR `+proj=tmerc` AND `+proj=utm`; PROJ4J UP TO 1.4.3 ALWAYS
      RAN EVENDEN/SNYDER. This is the single largest behavioural change in the release and the
      largest cluster this regime has ever reported. `proj/TransverseMercatorProjection.java`'s
      class javadoc states it as a deliberate breaking change -- "Every existing Proj4J user's
      UTM and State-Plane output moves. That is the fix, not an accident" -- with upstream's own
      selection at `proj_internal.h:840-841` and `data/proj.ini`'s
      `tmerc_default_algo = poder_engsager`.

      THE MECHANISM PREDICTS WHICH ROWS MOVE AND BY HOW MUCH, WHICH IS THE STANDARD THIS FILE
      SETS (golden/README.md: "A mechanism that predicts which rows move *and* which do not is
      the standard; a row list is not"). The two series differ as a function of distance from
      the central meridian, and that javadoc tabulates it independently of this suite:

        2 deg   about 2 micrometres
        6 deg   about 0.9 mm
        20 deg  metres
        45 deg  kilometres

      MEASURED AGAINST THAT PREDICTION, on this suite's own rows. Every REG transverse-Mercator
      probe was bucketed by its angular distance from its own definition's `lon_0` (or `lonc`,
      or the `zone` central meridian):

        bucket    rows     median movement
        0-5 deg     112     37 m          <- NOT this mechanism; see below
        5-10 deg 14,748     2.53e-4 m     <- this mechanism, and 0.25 mm at 5-10 deg is
                                             exactly the javadoc's 0.9 mm at 6 deg
        60-65 deg   164    120 m          <- NOT this mechanism; see below

      The 5-10 degree bucket is where the registry dictionaries put almost every UTM zone and
      State Plane zone, and its median is the predicted sub-millimetre. The 0-5 and 60-65
      buckets are dominated by something else entirely -- 37 m and 120 m at 0-5 degrees from the
      central meridian is impossible for a series-truncation difference, which is smallest
      there -- and that something else is the NADCON grid shift now being applied to
      `datum=NAD27` definitions. THE BAND IS WHAT SEPARATES THEM, and it does so cleanly: the
      NAD27 population is 3.7 m to 378 m and this rule stops at 1 cm.

      WHAT THE 1e-2 CEILING GUARANTEES, STATED PRECISELY, BECAUSE `magnitude` IS THE MAXIMUM
      OVER THE MOVED COLUMNS AND THOSE COLUMNS HAVE DIFFERENT UNITS. No claimed row moves by
      more than 1e-2 in ANY column -- 10 mm for `fx`/`fy`/`fz` on a projected target, and 0.01
      degrees on the always-degrees `ix`/`iy`/`iz`, which would be 1.1 km and is the loose end
      of the bound. So it was measured directly over all 14,724 claimed rows:

        fx  max 3.502e-3 m       (REG epsg:20790 probe 0)
        fy  max 7.301e-4 m       (REG epsg:29901 probe 0)
        fz  max 5.540e-4 m       (REG epsg:29901 probe 3)
        ix  max 1.214e-6 deg     (REG epsg:27391 probe 0)  = 13 cm
        iy  max 1.018e-7 deg     (REG epsg:27391 probe 0)  = 1.1 cm
        iz  max 1.166e-6 m

      The degree-valued columns are four orders of magnitude below the ceiling, so in practice
      the band is a 3.5 mm bound and the maximum is always driven by `fx`. If a future change
      ever pushes an inverse column up towards 0.01 degrees this rule would still claim the row,
      which is the one hole in it and is why it is written down here rather than left implied.

      THE INVERSE GETTING **BETTER** IS VISIBLE IN THESE ROWS AND IS PART OF THE CHANGE.
      `REG epsg:2000` (Antigua, `+proj=tmerc +lon_0=-62`, probes 5 degrees out) moves `fx` by
      2.60e-4 m and its round trip moves from `ix = -66.99999999825083` to `-67.0` EXACTLY, and
      `iy` from `-4.999999999921043` to `-5.0` exactly -- the committed probe, to the bit. The
      Evenden/Snyder round trip was 1.7e-9 degrees short; Poder/Engsager is exact. That is the
      1 nm accuracy the javadoc claims, observed.

      FOUR THINGS THIS RULE DELIBERATELY DOES NOT CLAIM, each left UNEXPLAINED with an owner:
        * The 332-row `Extended Transverse Mercator: longitude ... outside the projection
          domain` cluster (`OK -> ProjectionException`). Reserved by golden/README.md; a rule
          here would be a rule for a bug. It is excluded structurally, by `status_from: OK` and
          `status_to: OK`.
        * Section `CSV` in its entirety -- 1,248 unexplained `proj4-epsg.csv` transverse-Mercator
          rows, inside the reserved 1,163-row re-pin that is still awaiting a user decision.
          157 of them are below this rule's ceiling and would have been claimed; they are not,
          because "still moving" beats "would have matched".
        * Section `PAIR` in its entirety -- 346 rows, all of them ABOVE the ceiling anyway
          (1e3 .. 1.8e12 metres), which are transverse-Mercator targets probed thousands of
          kilometres outside their own zone, where BOTH series are meaningless. A change from
          one meaningless number to another is not something this rule should dignify.
        * Everything at or above 1 cm on REG and SYN -- 686 REG rows (380 of them `datum=NAD27`)
          and 104 SYN rows.

      Floor 1e-6 so that NUM-KARNEY-LATITUDE-CORE keeps the sub-micrometre drift it exists for;
      the smallest movement claimed here is 1.373e-6.

      ORDERED AFTER DATUM-LEGACY-OSGB36-PRECISION AND DATUM-LEGACY-CARTHAGE-ELLIPSOID ON
      PURPOSE, AND IT MATTERS. `epsg:27700` is a `tmerc` whose rows move 2.55 .. 3.26 mm, which
      is INSIDE this rule's band; placed earlier, this rule would have taken all ten OSGB36 rows
      and turned a pinned datum-precision rule into a COUNT_MISMATCH -- the same laundering
      PARSE-NO-KEYWORD-ALLOWLIST committed against PARSE-R-DECLARES-SPHERE and that this file's
      ordering discipline exists to prevent. Verified on the frozen tree: neither `epsg:27700`
      nor `epsg:4277` appears among the 14,724 rows this rule claims. `DATUM-LEGACY-CARTHAGE`'s
      four transverse-Mercator keys are above the ceiling at 46 .. 55 mm and so are safe in
      either order, but they are ordered first for the same reason.
    match:
      classifications: [CHANGED]
      sections: [REG, SYN]
      tgt_proj: [tmerc, utm]
      status_from: "OK"
      status_to: "OK"
    expect:
      dimensions: [fx, fy, fz, ix, iy, iz]
      magnitude: {min: 1.0e-6, max: 1.0e-2}

  # ---------------------------------------------------------------------------------------------
  # ORDERED IMMEDIATELY BEFORE NUM-KARNEY-LATITUDE-CORE, and that placement is the whole point.
  # NUM-KARNEY-LATITUDE-CORE matches EVERY changed row under 1e-6 and is pinned at 19,324; without
  # this rule ahead of it the two rows below are absorbed there and it reads 19,326, which is
  # exactly the COUNT_MISMATCH that found them. The big provisional rule keeps its count and this
  # change owns its own rows, by name.
  - id: NUM-LAEA-HYPOT-TO-NORM2
    status: active
    expires: 2027-06-30
    # PINNED at 2, and the two keys are ENUMERATED rather than globbed. Measured 2026-08-03 on a
    # frozen A/B: two full golden runs from one tree differing in exactly one file,
    # proj/LambertAzimuthalEqualAreaProjection.java, nothing else touched between them. Without the
    # change: 41,416 CHANGED / 39,125 INTENDED / 2,291 UNEXPLAINED and no COUNT_MISMATCH. With it:
    # 41,418 / 39,127 / 2,291 and NUM-KARNEY-LATITUDE-CORE 19,324 -> 19,326. The delta is +2 in
    # CHANGED and +2 in INTENDED and ZERO in UNEXPLAINED, so these two rows are the entire blast
    # radius and they were UNCHANGED before.
    #
    # The two rows, by diff of the two runs' golden-report.tsv:
    #   proj4-epsg.csv:00619 probe 0   EPSG:4326 -> EPSG:2163   moved ix,iy   mag 0x1.dp-47
    #   proj4-epsg.csv:01495 probe 0   EPSG:4326 -> EPSG:3409   moved iy      mag 0x1.ccp-47
    expected_rows: 2
    reason: |
      Math.hypot replaced by MathHelpers.norm2 at LambertAzimuthalEqualAreaProjection:274 and :314,
      the two sites in laea's INVERSE. Both compute sqrt(a*a + b*b); hypot adds fdlibm's overflow
      scaling, costs roughly ten times a sqrt, and is what MathHelpers' own javadoc says not to use
      when the operands are bounded -- which these are, being the projected coordinate already
      divided by the semi-major axis. The same substitution was made in etmerc earlier and
      SolverBenchmark measures the pair head to head.

      WHY EXACTLY TWO ROWS, when the dictionary holds far more laea definitions. Both changed sites
      are in projectInverse; the forward is untouched, and both moved rows moved ONLY in ix/iy, the
      inverse columns. That is the signature and it is why `dimensions` below excludes fx/fy/fz.
      EPSG:2163 (+proj=laea +lat_0=45 +lon_0=-100 +a=+b=6370997) and EPSG:3409 (+proj=laea
      +lat_0=-90 +a=+b=6371228) are both SPHERICAL, so both take projectInverse_s and site :274.
      Every other laea row either round-trips to the same double anyway or takes a path where the
      last-bit difference is absorbed before it reaches a printed column -- population is not blast
      radius, and the measured count is 2 out of the whole laea family. Note EPSG:3408, the north
      polar twin of 3409 one line earlier in the same file, did NOT move.

      THE BAND IS AN ULP ARGUMENT, not a round number. The two magnitudes are 0x1.dp-47 =
      1.279e-14 and 0x1.ccp-47 = 1.270e-14, in the always-degrees inverse columns. ulp(45.0) is
      7.11e-15 and ulp(90.0) is 1.42e-14, so both moves are one to two ulp of a latitude of that
      size -- i.e. the last bit of the inverse, which is precisely what swapping one correctly
      rounded sqrt formulation for another can do and all it can do. The ceiling of 1e-13 is about
      seven ulp at 45 degrees; anything larger is not a last-bit difference and must stay
      UNEXPLAINED rather than being dignified by this rule. It is also seven orders of magnitude
      below the 1e-6 that NUM-KARNEY-LATITUDE-CORE would have allowed it.

      CONFORMANCE DID NOT MOVE: 7,441/7,900, regressed 0, measured on the same tree.
    match:
      classifications: [CHANGED]
      sections: [CSV]
      keys: ["proj4-epsg.csv:00619", "proj4-epsg.csv:01495"]
      probes: [0]
    expect:
      dimensions: [ix, iy]
      allow_status_change: false
      allow_inside_change: false
      allow_nonfinite: false
      magnitude: {min: 0.0, max: 1.0e-13}

  # ---------------------------------------------------------------------------------------------
  - id: NUM-KARNEY-LATITUDE-CORE
    status: active
    expires: 2026-12-31
    # PINNED at 19336, measured 2026-08-01 on a frozen /tmp snapshot, and corroborated independently
    # by FAILCLOSED-NAD27-OUTSIDE-GRID-REPORTED's reason, which predicts "NUM-KARNEY-LATITUDE-CORE
    # 20,191 -> 19,336 (-855)". golden/README.md's 16,202 is an earlier snapshot.
    #
    # THIS IS THE LARGEST RULE IN THE FILE AND THEREFORE THE ONE A TBD COST MOST. Nineteen thousand
    # rows of sub-micron drift, with the band below as the only other constraint, is the single
    # easiest place in this suite for an unrelated change to hide -- and while the count was TBD
    # nothing was watching its size at all. The rule is still PROVISIONAL and still owned by the
    # numerical-core stream (see the reason below); pinning does not adopt it, it makes handing it
    # over an event rather than a silence. When that stream lands, this fails with a COUNT_MISMATCH
    # naming itself and the owner re-pins it with a band justified per section.
    # RE-PINNED 2026-08-01 by the GRIDS-EPSG-SHIP-CONUS stream: proj4j-epsg now ships PROJ
    # 9.8.1's `conus` at proj4/nad/conus, so the golden run resolves that grid for the first
    # time (golden depends on proj4j-epsg and, unlike core's own tests and the conformance
    # module, has no other copy on its classpath). Measured on a frozen /tmp A/B whose two
    # trees differ in exactly one byte-bearing file, the grid itself. -12, likewise enumerable: `SYN mod/{lcc,longlat}/nadgrids_conus`, 5 probes each, plus 2 more of
    # the same family. Claimed by GRIDS-EPSG-CONUS-SYN-REFUSED.
    expected_rows: 19324
    reason: |
      PROVISIONAL AND NOT OWNED BY THIS MODULE. Placeholder for the sub-microscopic movement caused by
      wiring in PROJ 9.4-9.6's Karney auxiliary-latitude core (9.8.1:src/latitudes.cpp, and the
      rewritten mlfn.cpp / phi2.cpp / tsfn.cpp). Measured improvements at GRS80: authlat 1.58 mm ->
      0.7 nm, mlfn 4,920 nm -> < 1 nm, phi2 4,145 nm -> 2.1 nm, tsfn(0) 0.9999999999999999 ->
      exactly 1.0.

      The numerical-core owner must replace this rule with one carrying a pinned expected_rows and a
      band justified per section. It exists now only so that ~18,000 rows of genuine sub-micron drift
      do not bury the ~1,700 rows of structural change underneath them.

      The band is deliberately tight -- 1e-6 in raw column units, i.e. 1 micrometre for a projected
      target and ~0.1 m for the always-degrees inverse columns -- because the measured magnitude
      distribution is bimodal with an empty valley between 1e-5 and 1e-3. Everything above the band
      stays UNEXPLAINED on purpose: that is the backlog. It also refuses status changes, inside
      changes and non-finite endpoints, so it cannot absorb anything structural.

      Note the short expiry. This is a migration-window rule, not a specification.
    match:
      classifications: [CHANGED]
    expect:
      dimensions: [fx, fy, fz, ix, iy, iz]
      allow_status_change: false
      allow_inside_change: false
      allow_nonfinite: false
      magnitude: {min: 0.0, max: 1.0e-6}

  # ---------------------------------------------------------------------------------------------
  # ORDERED LAST, DELIBERATELY. Its magnitude band (1e-4 .. 1e4) overlaps the top of
  # PROJ-TMERC-PODER-ENGSAGER-DEFAULT's (1e-6 .. 1e-2), so placed before that rule it would take its
  # NAD27 tmerc rows and turn a pinned count into a COUNT_MISMATCH -- the same hazard that made the
  # tmerc rule have to follow DATUM-LEGACY-OSGB36-PRECISION. Verified on the frozen tree that all 852
  # rows this claims were UNEXPLAINED beforehand and that it takes nothing from any other rule.
  - id: DATUM-NAD27-NADCON-SHIFT-APPLIED
    status: active
    expires: 2027-06-30
    # PINNED. Measured 2026-08-01 on the same frozen A/B as
    # FAILCLOSED-NAD27-OUTSIDE-GRID-REPORTED, with the predicate evaluated against the report before
    # the rule was written. 865 REG rows carry datum=NAD27 and are OK -> OK; 852 of them are inside
    # the band and 13 are not -- see the last paragraph.
    # RE-PINNED 2026-08-01 by the GRIDS-EPSG-SHIP-CONUS stream: proj4j-epsg now ships PROJ
    # 9.8.1's `conus` at proj4/nad/conus, so the golden run resolves that grid for the first
    # time (golden depends on proj4j-epsg and, unlike core's own tests and the conformance
    # module, has no other copy on its classpath). Measured on a frozen /tmp A/B whose two
    # trees differ in exactly one byte-bearing file, the grid itself. +1,074, the other side of FAILCLOSED-NAD27-OUTSIDE-GRID-REPORTED's -1,104. The two are one
    # migration; the 30-row difference is the rows that land in the three GRIDS-EPSG-CONUS-* rules.
    expected_rows: 1926
    reason: |
      NAD27 registry CRS now receive the NADCON grid shift. In the 1.4.3 baseline they receive none
      at all, so every one of these rows moves by the whole shift.

      THE MECHANISM, and it is a parser fix rather than anything in this module's territory.
      parser/Proj4Parser used to call setGrids(null) on the SHARED STATIC Datum.NAD27 singleton
      while parsing any +datum=NAD27 definition carrying no +nadgrids token. EPSG:4267 is
      `+proj=longlat +datum=NAD27 +no_defs`, so the first NAD27 CRS parsed destroyed the grid list
      process-wide -- including its own -- and Datum.getTransformType() flipped
      TYPE_GRIDSHIFT -> TYPE_UNKNOWN for all 205 codes on that datum. Every NAD27 row in the 1.4.3
      baseline is therefore unshifted. The parser now copies into a DatumParameters instead, and
      Datum.setGrids refuses on NAD27 and POTSDAM outright. This matches PROJ, whose +datum=NAD27
      is nadgrids=@conus,@alaska,@ntv2_0.gsb,@ntv1_can.dat.

      WHAT IDENTIFIES IT AS THE DATUM AND NOT A KERNEL. Twelve of these rows have a `longlat`
      target -- no projection in the path at all -- and they move 1.71e-4 to 7.18e-4 DEGREES, i.e.
      19 m to 80 m. A projection kernel cannot move a row that runs no projection. epsg:4267 probe 0
      is the cleanest single instance: fx goes from -100.0, the input ECHOED BACK, to -99.99949894.

      THIS RULE COULD NOT BE WRITTEN BEFORE, AND THAT IS WHY THE `datums` COLUMN EXISTS. rules.yaml
      had no predicate for a parameter's VALUE: params_present matches KEYS, and `datum` is a key
      1,962 dictionary lines carry. Scoping this cluster by key meant enumerating ~205 keys, which
      would also have swept in ~1,066 rows belonging to a live stream -- exactly the shape of rule
      this file exists to prevent. golden-index.tsv now carries a sixth column holding the sorted
      set of +datum= values on either side, and `datums:` matches ANY-of over it. Five lines of
      rule, and the honest UNEXPLAINED paragraph in golden/README.md that stood in for it since the
      second triage can go.

      THE BAND, in the raw units this file warns about. 840 of the 852 have a projected target and
      move 1.0 m to ~1e3 m; 12 have a geographic target and move 1.71e-4 to 7.18e-4 degrees. One
      band has to span both because magnitude is not unit-normalised here, so it is stated as
      measured rather than as a round number: floor 1e-4 (below the smallest degree-column move,
      above nothing this rule wants), ceiling 1e4. Per-column maxima over the 852: fx 1.43e6 is
      EXCLUDED by the ceiling, and within the band fx/fy stay under 1e4 m and ix/iy under
      1.6e-7 deg. The floor also keeps this rule clear of the two sub-millimetre bands
      (NUM-KARNEY-LATITUDE-CORE at <=1e-6, PROJ-TMERC-PODER-ENGSAGER-DEFAULT at 1e-6..1e-2), both of
      which are ordered ahead of it in any case.

      THE THIRTEEN ROWS THIS DELIBERATELY DOES NOT CLAIM. `esri:26731` and `esri:102120` are omerc
      and move 6.1e5 to 2.03e6 metres -- 610 km to 2,030 km. That is not a datum shift by three
      orders of magnitude; it is the omerc far field, the same shape this module already declines to
      rule for the PAIR residue, where "both series are meaningless out there and a change from one
      meaningless number to another is not something a rule should dignify". They stay UNEXPLAINED
      and the report will record this rule DECLINING them on magnitude. -> omerc owner.

      NOT CLAIMED EITHER, on the sections' own reserved grounds: the 10 CSV and 29 PAIR NAD27
      OK -> OK rows. CSV is inside the reserved proj4-epsg.csv re-pin and PAIR's residue is
      explicitly not to be ruled. `sections: [REG]` is what keeps this rule out of both.
    match:
      sections: [REG]
      datums: [NAD27]
      status_from: "OK"
      status_to: "OK"
    expect:
      dimensions: [fx, fy, fz, ix, iy, iz]
      allow_status_change: false
      allow_inside_change: true
      allow_nonfinite: false
      magnitude: {min: 1.0e-4, max: 1.0e4}

  # ---------------------------------------------------------------------------------------------
  # proj4j-epsg now ships PROJ 9.8.1's `conus` (264,424 B, CTABLE V2, blob 44b4900f) at
  # proj4/nad/conus. The three rules below claim the 38 rows that move because of it and nothing
  # else. They are ordered LAST on purpose: every row they claim was UNEXPLAINED in the measured
  # run, so no earlier rule can lose a row to them and the six counts re-pinned above are exactly
  # what the frozen A/B measured.
  #
  # KEYS AND PROBES ARE ENUMERATED, NEVER GLOBBED, and the probe filters are load bearing rather
  # than decorative:
  #   * `mod/tmerc/nadgrids_conus` probes 1-4 were ALREADY UNEXPLAINED before this change (they
  #     belong to the transverse-Mercator stream, which rules.yaml states is awaiting a user
  #     decision and whose rows nothing in this pass may claim). Only probe 0 is newly changed, so
  #     GRIDS-EPSG-CONUS-SYN-TMERC-REFUSED takes probe 0 and leaves the other four where they are.
  #   * The twelve PAIR keys have all five probes UNEXPLAINED, but only probe 1 is NEW -- the other
  #     48 are pre-existing residue. A key-only rule would absorb 48 rows behind this reason, which
  #     is the exact failure this file was built to prevent.
  # Together they take UNEXPLAINED from 2,329 back to 2,291, the pre-change figure -- this stream
  # adds no residue and removes none.

  - id: GRIDS-EPSG-CONUS-SYN-REFUSED
    status: active
    expires: 2027-06-30
    # PINNED at 25 = 5 keys x 5 probes, measured on the frozen A/B before the rule was written.
    expected_rows: 25
    reason: |
      A CRS that declares `+nadgrids=conus` and is then handed a point in Europe or Africa now
      REFUSES instead of quietly returning the point unshifted.

      THE MECHANISM, and it is packaging rather than arithmetic. These synthetic definitions carry
      `+nadgrids=conus`. Until now no `conus` existed anywhere on golden's classpath -- golden
      depends on proj4j-epsg, which shipped only ntv1_can.dat -- so Grid.fromNadGrids resolved the
      token to NOTHING and left the grid list EMPTY. Grid.shift's fail-closed throw fires when a
      NON-empty list covers no grid for the point; an empty list is not that case, so the transform
      returned the input coordinate and reported success. proj4j-epsg now ships conus, the list is
      non-empty, and the refusal path is reachable for the first time.

      WHY REFUSING IS THE CORRECT ANSWER HERE, and it is checkable from the probe file rather than
      asserted. conus covers 131W-63W, 20N-50N. The five SYN probe points, decoded from
      probes.tsv's hex, are (10, 45), (-11.21, 30), (31.21, 30), (-11.21, 60) and (31.21, 60) --
      every one of them in Europe, Africa or the North Atlantic, between about 4,700 and 12,000 km
      outside the grid. A definition that names a US grid and is then asked about Cairo has no
      answer, and non-negotiable 3 says the failure must not be expressed as a plausible
      coordinate. The old behaviour returned the input unchanged, which is precisely that.

      NOT A REGRESSION AND NOT A WIDENING. The same run shows the CONUS points that ought to shift
      now shifting to PROJ 9.8.1's values -- see core's ConusShipsInEpsgArtifactTest, which pins
      San Francisco and Kansas against `cct +proj=hgridshift +grids=conus` and keeps Honolulu,
      San Juan, Anchorage and the Gulf of Guinea throwing.

      WHERE THESE ROWS CAME FROM. All 25 were INTENDED before this change, attributed to rules that
      describe projection and latitude arithmetic -- PROJ-AEA-SPHERICAL-INVERSE (the 5 aea rows)
      and NUM-KARNEY-LATITUDE-CORE (the lcc and longlat rows and their family). Those rules
      described the numeric drift of a coordinate that should never have been produced. With the
      coordinate withdrawn there is no drift left for them to describe, which is why both re-pin
      downward by exactly 5 and 12 and why that arithmetic is quoted at each of them.
    match:
      sections: [SYN]
      keys:
        - "mod/aea/nadgrids_conus"
        - "mod/lcc/nadgrids_conus"
        - "mod/longlat/nadgrids_conus"
        - "mod/merc/nadgrids_conus"
        - "mod/utm/nadgrids_conus"
      classifications: [CHANGED]
      status_from: "OK"
      status_to: "EXC:org.locationtech.proj4j.CrsTransformException"
    expect:
      allow_status_change: true
      allow_inside_change: true
      allow_nonfinite: true

  - id: GRIDS-EPSG-CONUS-SYN-TMERC-REFUSED
    status: active
    expires: 2027-06-30
    # PINNED at 1. `mod/tmerc/nadgrids_conus` probes 1-4 were UNEXPLAINED before this change and
    # stay UNEXPLAINED: they are the transverse-Mercator stream's rows and this file says nothing
    # in this pass claims any of them. Probe 0 was UNCHANGED before and is newly CHANGED, so it is
    # this stream's row and only it is claimed. Separating one row into its own rule is deliberate:
    # folding it into the rule above would have needed a key glob that also swept up the four.
    expected_rows: 1
    reason: |
      The `+proj=tmerc` member of the GRIDS-EPSG-CONUS-SYN-REFUSED family, split out so that the
      four probes belonging to another stream are not absorbed by this one. Same mechanism, same
      evidence: `+nadgrids=conus` now resolves, the probe point is outside the grid, and the
      transform reports COORDINATE_OUTSIDE_GRID instead of echoing the input back as a success.

      Probe 0 is (10, 45) -- central Europe, roughly 4,700 km east of conus's eastern edge at 63W.
    match:
      sections: [SYN]
      keys: ["mod/tmerc/nadgrids_conus"]
      probes: [0]
      classifications: [CHANGED]
      status_from: "OK"
      status_to: "EXC:org.locationtech.proj4j.CrsTransformException"
    expect:
      allow_status_change: true
      allow_inside_change: true
      allow_nonfinite: true

  - id: GRIDS-EPSG-CONUS-PAIR-NAD27-SHIFTED
    status: active
    expires: 2027-06-30
    # PINNED at 12 = 12 enumerated keys x probe 1 only. All five probes of these keys are
    # UNEXPLAINED, but the other 48 were UNEXPLAINED before this change too and belong to the PAIR
    # residue this file explicitly declines to rule. `probes: [1]` is what keeps this rule from
    # absorbing them; without it the rule would claim 60 and quietly retire 48 rows of somebody
    # else's backlog behind a grid reason.
    expected_rows: 12
    reason: |
      The positive half, in the PAIR section: NAD27-source pairs whose probe 1 falls INSIDE conus
      and which therefore receive a real NADCON shift for the first time.

      Every source here is a NAD27 geographic CRS -- epsg:4267, esri:4267 and esri:104000, which is
      ESRI's own NAD27 code -- and the targets are projected CRS in the epsg:2000-21418 range. In
      the 1.4.3 baseline these rows received no datum shift at all, because no grid covering the
      point existed on the classpath. They now move by the grid shift propagated through the target
      projection, 1.88e4 to 4.66e7 in raw column units (projected metres, so the magnitude band is
      wide by construction; the enumeration of keys and the single probe are what make this rule
      tight, not the band).

      ONE ROW ALSO CHANGES STATUS, which is why allow_status_change is set:
      `t43/esri:104000>epsg:20092` probe 1 goes EXC:java.lang.IllegalStateException -> OK. That
      exception is datum/GeocentricConverter's out-of-range latitude guard; with the shift applied
      the latitude handed to it is in range. The remaining eleven are OK -> OK.

      WHY PROBE 1 AND NO OTHER PROBE. conus covers 131W-63W, 20N-50N and probe 1 is the only one of
      the five probe points these pairs use that lands inside it. That the other four are untouched
      is the evidence that this is grid coverage and not something applied indiscriminately -- a
      change that moved all five would not be a datum shift.
    match:
      sections: [PAIR]
      keys:
        - "t41/epsg:4267>epsg:2048"
        - "t42/esri:104000>epsg:21418"
        - "t42/esri:4267>epsg:2044"
        - "t42/esri:4267>epsg:2092"
        - "t43/epsg:4267>epsg:20009"
        - "t43/epsg:4267>epsg:20079"
        - "t43/epsg:4267>epsg:2392"
        - "t43/esri:104000>epsg:20022"
        - "t43/esri:104000>epsg:20092"
        - "t43/esri:104000>epsg:2468"
        - "t43/esri:4267>epsg:20066"
        - "t43/esri:4267>epsg:2094"
      probes: [1]
      classifications: [CHANGED]
      status_to: "OK"
    expect:
      dimensions: [fx, fy, fz, ix, iy, iz]
      allow_status_change: true
      allow_inside_change: true
      allow_nonfinite: true
      magnitude: {min: 1.0e4, max: 1.0e8}
