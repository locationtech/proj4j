    # rather than described in a comment.
    expected_rows: 67
    reason: |
      The registry and CSV consequences of the three forward defects named in
      PROJ-INVERSE-CORRECTED-ROUND-TRIP-NOW-EXACT-FWD-ALSO above, which is where the arithmetic
      is. Scoped by `tgt_proj` rather than by key because the mechanism is a property of the
      PROJECTION, not of any dictionary entry: every `+proj=eqdc`, `+proj=eqc` and `+proj=sinu`
      target in the suite is affected and no other target is.

        eqdc  49 rows over 10 keys (esri:102005 102010 102023 102026 102029 102031 102032 53027
              54027, SYN proj/eqdc). `esri:102023` at probe 0 moves `fy` -166,979.236 ->
              -165,861.794 -- 1,117 m, the `rho0` residue at 1.5 degrees south of a `+lat_1=20
              +lat_2=-23` cone -- and up to 7.7e5 m at the box corners.
        eqc   20 rows over 7 keys (epsg:4087 32662 32663, SYN proj/eqc, proj4-epsg.csv:01884
              03928 03929). All three EPSG keys are `+lat_ts=0` world equidistant cylindrical, so
              their movement comes from the `phi0` subtraction alone.
        sinu  13 rows over 3 keys (esri:102011, esri:54008, SYN proj/sinu). Every REG row moves by
              EXACTLY 3,712 m, which is `a * 45 deg - meridianArc(45 deg)` for GRS80 -- the
              spherical-to-ellipsoidal correction, constant because all these defs share
              `+lat_0=0` and the probes share a latitude.

      THE 3,712 m IS THE STRONGEST PART OF THIS RULE AND IS WHY THE BAND IS WHERE IT IS. It is not
      an observation to be tolerated, it is a predicted constant: 8 of the 13 sinu rows and 12 of
      the 20 eqc rows land on it to the last digit, and `REG poly WGS84` and `REG mill/vandg
      WGS84` rows land on 3,712 m and 622.7 m respectively for the same reason -- those are NOT
      claimed here, because `poly`, `mill` and `vandg` are separate projections with separate
