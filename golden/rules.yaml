  - id: PROJ-NSPER-REQUIRES-A-POSITIVE-H-RATIO
    status: active
    expires: 2027-06-30
    # PINNED at 5 = one key x 5 probes.
    expected_rows: 5
    reason: |
      THE FOURTH NAME THAT LEFT FAILCLOSED-NO-INVERSE-FOR-FORWARD-ONLY, AND THE ONLY ONE OF THE
      FOUR THAT LEFT BY GETTING STRICTER RATHER THAN BY GAINING AN INVERSE. `SYN proj/nsper`
      moves `OK` -> `EXC:InvalidValueException` at all five probes, with the message

        crs-tgt: +h=0.0 gives h/a = 0.0, which nsper rejects: upstream requires 0 < h/a <= 1e10
        (nsper.cpp:155-159). The bound is on the ratio, not on h.

      This is the only `OK -> ProjectionException`-family transition in the whole unexplained
      set that is not the reserved ETM domain cluster, so it is worth being explicit that it is
      a fail-closed improvement and not a capability loss.

      UPSTREAM, READ RATHER THAN RECALLED. 9.8.1:src/projections/nsper.cpp, `nsper_setup`:

          Q->height = pj_param(P->ctx, P->params, "dh").f;
          ...
          Q->pn1 = Q->height / P->a;                    /* normalize by radius */
          if (Q->pn1 <= 0 || Q->pn1 > 1e10) {
              proj_log_error(P, _("Invalid value for h"));
              return pj_default_destructor(P, PROJ_ERR_INVALID_OP_ILLEGAL_ARG_VALUE);
          }

      `+h` has no default, so an absent `+h` is `0.0`, `pn1` is `0.0`, and upstream refuses to
      build the operation. The canonical synthetic parameter set is
      `+ellps=GRS80 +lat_0=45 +lon_0=10 +lat_1=30 +lat_2=60 +x_0=0 +y_0=0 +units=m` and carries
      no `+h`, so every `proj/nsper` probe is that case. 1.4.3 built the projection anyway with
      a satellite at the centre of the Earth and returned five coordinates for it.

      A NOTE FOR THE PROJECTION'S OWNER, NOT A REASON TO DECLINE THE ROWS: the message cites
      `nsper.cpp:155-159` and the guard is at `:159-161` in 9.8.1 (`:158` is the `pn1`
      assignment). Three lines off, in a message this suite reproduces verbatim. Cosmetic, in
      `core/**`, and out of this module's scope.

      Baseline is a coordinate and the current side is all-NaN, which is the opposite direction
      from most of this file: the rule therefore vouches for nothing numeric, it records that
      five plausible-looking coordinates for an impossible satellite altitude are now an error.
      `inside` moves because the CRS no longer builds.
    match:
      classifications: [CHANGED]
      sections: [SYN]
      keys: ["proj/nsper"]
      status_from: "OK"
      status_to: "EXC:org.locationtech.proj4j.InvalidValueException"
    expect:
      dimensions: [fx, fy, fz, ix, iy, iz]
      allow_status_change: true
      allow_inside_change: true
      allow_nonfinite: true

