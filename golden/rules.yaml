# Golden-master change declarations.
#
# Every row of the golden table that differs from the pinned 1.4.3 baseline must be claimed by exactly
# one rule here, or the build fails. Rules are evaluated in FILE ORDER and the first one that both
# matches and expects a row wins, so order them most-specific first.
#
# THE POLICY THAT OVERRIDES EVERYTHING IN THIS FILE: gie wins. This suite has no opinion about whether
# a change is correct -- only about whether it was declared. A rule here is never evidence that an
# output is right, and a rule must never be written to make a gie failure go away. See golden/README.md,
# "Policy".
#
# Schema, and the four things that keep a rule from becoming a rubber stamp, are documented in
# golden/src/test/java/org/locationtech/proj4j/golden/GoldenRules.java. In brief:
#   * expected_rows is EXACT and TWO-SIDED. Fewer rows than declared fails too.
#   * status: active  -> must match >= 1 row, else DEAD_RULE
#     status: pending -> must match EXACTLY 0 rows; matching one fails with PENDING_RULE_FIRED
#   * expires is mandatory. Past it, the build fails until the rule is folded into a new baseline.
#   * a failing `expect` clause makes the rule DECLINE the row; it does not claim it.
#
# UNITS WARNING. `magnitude` is |current - baseline| in the RAW UNITS OF THE COLUMN, and those units
# differ by row: fx/fy/fz are in the target CRS's units (metres for a projected target, degrees for a
# geographic one) and ix/iy/iz are always WGS84 degrees, because the inverse column is the round trip
# back to the lon/lat hub. There is deliberately NO unit normalisation here. Normalising would mean
# choosing a metric branch per row, which is exactly the decision that inflated a downstream team's
# entire worklist by ~111,319x. Choose the band with the section's units in mind and say which you
# meant in `reason`.

version: 1

rules:

  # ---------------------------------------------------------------------------------------------
  # ORDERED FIRST, DELIBERATELY. See the note at the end of this rule's `reason`: placed anywhere
  # after FAILCLOSED-UNCHECKED-ISE-REPLACED it hands that rule 34 of these rows, which would record
  # "1.4.3 threw an unchecked IllegalStateException and we now throw a Proj4jException" for a change
  # that is actually a grid-coverage refusal. That is the laundering PARSE-NO-KEYWORD-ALLOWLIST
  # committed against PARSE-R-DECLARES-SPHERE, and this file exists partly to prevent it.
  - id: FAILCLOSED-NAD27-OUTSIDE-GRID-REPORTED
    status: active
    expires: 2027-06-30
    # PINNED. Measured 2026-08-01 on a frozen /tmp A/B whose two trees differed in exactly the 14
    # files this stream touched, of which Grid.java is the only one in core/src/main. The predicate
    # was measured on the frozen report BEFORE the rule was written, not pasted from the gate's own
    # count afterwards.
    # RE-PINNED 2026-08-01 by the GRIDS-EPSG-SHIP-CONUS stream: proj4j-epsg now ships PROJ
    # 9.8.1's `conus` at proj4/nad/conus, so the golden run resolves that grid for the first
    # time (golden depends on proj4j-epsg and, unlike core's own tests and the conformance
    # module, has no other copy on its classpath). Measured on a frozen /tmp A/B whose two
    # trees differ in exactly one byte-bearing file, the grid itself. 1,104 rows that had no grid to be outside OF now find one and are shifted instead; they move to
    # DATUM-NAD27-NADCON-SHIFT-APPLIED below.
    expected_rows: 891
    reason: |
      datum/Grid.java's `shift` no longer returns the input coordinate when no grid in a non-empty
      list can supply a value for it. It raises
      CrsTransformException(ErrorCause.COORDINATE_OUTSIDE_GRID), which is the signal that method's
      own comment already named and never sent.

      THE DEFECT. The `else` branch was empty. The coordinate came back bit-identical to the input,
      which is indistinguishable from "the shift was zero", and the transform reported success. That
      is non-negotiable 3 -- a failure expressed as a plausible coordinate -- at 30 m to 110 m.

      UPSTREAM, MEASURED, not inferred from the source. PROJ 9.8.1 (Rel. 9.8.1, April 10th, 2026)
      reading the same ntv1_can.dat bytes proj4j-epsg ships, with PROJ_DATA pointed at a directory
      holding only those files:

        echo "1 -1" | cs2cs -f "%.10f" +proj=longlat +datum=WGS84 \
             +to +proj=longlat +ellps=clrk66 +nadgrids=@conus,@alaska,@ntv2_0.gsb,@ntv1_can.dat
          *  * inf

      That is the exact +datum=NAD27 grid list, with EVERY grid present, refusing a point outside all
      of them. proj4j answered `1, -1`. In source terms it is pj_hgrid_apply (grids.cpp:3517-3520):
      findGrid returns nullptr and PROJ_ERR_COORD_TRANSFM_OUTSIDE_GRID is set. The second shape --
      a grid contains the point but the interpolation cannot produce a value -- lands on the same
      errno at :3534-3536.

      WHY EVERY ROW IS NAD27, AND WHY THE PREDICATE IS `datums` RATHER THAN A STATUS GLOB. All 1,995
      rows report the grid list `[ntv1_can.dat]`: proj4j-epsg ships exactly one of NAD27's four
      @-optional grids, so outside 40N-84N / 142W-44W there is no coverage at all. `+datum=potsdam`
      is the negative control and it did NOT move -- 17 proj4-epsg.csv rows reference a
      datum=potsdam def, BETA2007.gsb is absent, its grid list therefore resolves EMPTY, and an
      empty list is a no-op. "The grid file is not there" stays silent; only "outside a grid that
      loaded" errors. Those are different questions and only the first is legitimately silent, which
      is also why PROJ's @-optional wart is untouched by this change.

      Scoping by `status_to` alone would have swept in 105 rows belonging to
      FAILCLOSED-NO-INVERSE-FOR-FORWARD-ONLY (65) and FAILCLOSED-NO-INVERSE-FOR-NEW-FORWARD-ONLY
      (40), which raise the same exception type for an entirely different reason. `datums: [NAD27]`
      separates them completely: measured on the frozen tree, exactly 1,995 changed rows carry both
      predicates and exactly 105 carry the status without the datum.

      THE ROW SET, measured: REG 1,673 / CSV 148 / PAIR 144 / SYN 30. Baseline side: 1,949 OK, 34
      java.lang.IllegalStateException, 8 UnsupportedParameterException, 2 InvalidValueException,
      2 NumberFormatException. 202 of them were bit-identical to 1.4.3 before this change -- that
      is, 1.4.3 and the current tree fail-opened in exactly the same way, which is why the golden
      regime could not see them until now.

      WHERE THESE ROWS CAME FROM, so the drop in five other rules' counts is accounted for rather
      than merely noticed. 1,614 of them were claimed by another rule before this change and no
      longer are, because a row that throws has no numeric movement left to attribute:
      PROJ-TMERC-PODER-ENGSAGER-DEFAULT 14,724 -> 14,038 (-686), NUM-KARNEY-LATITUDE-CORE
      20,191 -> 19,336 (-855), DATUM-ISEQUAL-SELF-COMPARISON 332 -> 284 (-48),
      PARSE-VUNITS-ACCEPTED 964 -> 956 (-8), PROJ-POLYCONIC-KERNEL-CORRECTED 51 -> 43 (-8),
      PROJ-AEA-SPHERICAL-INVERSE 164 -> 159 (-5), PROJ-POLYCONIC-INVERSE-CONVERGES 6 -> 4 (-2),
      PARSE-DMS-PARAMETER-VALUE 10 -> 8 (-2). The four pinned ones are re-pinned in place with the
      same note. The remaining 381 were already UNEXPLAINED.

      FAILCLOSED-UNCHECKED-ISE-REPLACED is the one that moves the other way and it is why this rule
      is ordered first: it would GROW from 55 to 71 by absorbing rows of this mechanism behind a
      reason that says nothing about grids. With this rule ahead of it, it gives up all 34 of its
      NAD27 grid rows and lands at 37. It is TBD-pinned, so that movement would otherwise have been
      silent.

      THE DELIBERATE DIVERGENCE IS KEPT. Grid.shift still falls through to the NEXT grid when the
      grid it selected refuses to interpolate, where PROJ commits to findGrid's choice. That was a
      recorded conscious decision and reversing it is a separate behavioural change with its own row
      set; it is not smuggled in here. It is also orthogonal: the fall-through can only ever return a
      value that some grid the caller listed produced for this point, whereas the `else` branch
      invented one. Keeping it makes this change as small as it can be. Pinned by
      grids/OutsideGridFailsClosedTest#interpolationFailureStillFallsThroughToTheNextGrid.

      NOT A CORRECTNESS CLAIM, per this file's policy. At the CRS level with proj.db present,
      cs2cs +to +proj=longlat +datum=NAD27 at (1, -1) returns the point unchanged, because PROJ's
      operation factory sees the coordinate is outside NADCON's area of use and selects "Ballpark
      geographic offset" (verified with PROJ_DEBUG=2) -- a DECLARED no-op, not a silent one.
      proj4j's legacy +datum= path has no such factory; it is the operator path, and the operator
      path errors. Reproducing the ballpark selection belongs to db/ and the strict API, and until
      it exists this change is a behavioural break for any caller currently receiving a silent
      no-op.
    match:
      datums: [NAD27]
      status_to: "EXC:org.locationtech.proj4j.CrsTransformException"
    expect:
      allow_status_change: true
      allow_inside_change: true
      allow_nonfinite: true

  # ---------------------------------------------------------------------------------------------
  - id: PROJ-GEOCENT-LON0-APPLIED
    status: active
    expires: 2027-06-30
    # PINNED, and pinnable because this change is complete and its row set is a committed input:
    # `proj/geocent` is one SYN key and SYN carries 5 probes. Measured 2026-08-01 from a frozen
    # A/B in which GeocentProjection.java was the ONLY file that differed between the two trees.
    expected_rows: 5
    reason: |
      proj/GeocentProjection.java overrode projectRadians(src, dst) and inverseProjectRadians(src,
      dst) without the +lon_0 handling that Projection's own implementations of those two methods
      perform for every other projection, so a `+proj=geocent +lon_0=10` definition produced the
      same (X, Y, Z) as `+lon_0=0`.

      Upstream applies it. 9.8.1:src/conversions/geocent.cpp:56-57 declares
      `P->left = PJ_IO_UNITS_RADIANS` and `P->right = PJ_IO_UNITS_CARTESIAN`, so the generic
      wrappers run: fwd_prepare's angular branch ends with
      `lam = (lam - from_greenwich) - lam0` followed by adjlon (fwd.cpp:105-112), and
      inv_finalize's PJ_IO_UNITS_RADIANS branch adds lam0 back and adjlons again
      (inv.cpp:110-118). proj4j's own pipeline engine already ports exactly that -- see
      pipeline/Cs2csOperator.java:449-462 and :510-518, where the lam0 term is applied for every
      kernel EXCEPT Kernel.PROJECTION, precisely because for a projection it is
      Projection.projectRadians that does it. GeocentProjection is the one place where neither
      side did.

      Both sides of the new code are guarded on `projectionLongitude != 0`, exactly as
      Projection.projectRadians and Projection.inverseProjectRadians guard theirs, so a definition
      without +lon_0 is bit-for-bit unchanged -- `x + 0.0` is not the identity on -0.0. That
      guard is why this rule claims 5 rows and not 1,058: the 181 epsg `+proj=geocent` defs, the
      148 CSV cases that reference them and the one `mod/` sweep row all carry no +lon_0 and
      returned to the baseline value exactly (1,045 of them UNCHANGED; 8 more moved by 1e-9 m in
      the height ordinate from OTHER streams' datum-stage drift and are claimed by
      NUM-KARNEY-LATITUDE-CORE, which is correct attribution -- those 8 rows were previously
      unobservable because the whole row was an exception).

      The magnitude band is the physics of the change, not an observation: rotating a point at
      Earth radius by 10 degrees of longitude moves it by at most
      2 * 6.378e6 * sin(5 deg) = 1.11e6 m, so the ceiling is 2e6 metres. The observed spread over
      the five probes is 4.98e5 .. 9.23e5 m in fx/fy. Anything outside that band is not a
      longitude rotation and this rule must not explain it. Units: fx/fy/fz are metres here (a
      cartesian target); ix/iy are the always-degrees inverse columns and move only by round-trip
      residue.
    match:
      classifications: [CHANGED]
      sections: [SYN]
      keys: ["proj/geocent"]
      tgt_proj: [geocent]
    expect:
      dimensions: [fx, fy, fz, ix, iy, iz]
      magnitude: {min: 1.0e-12, max: 2.0e6}

  # ---------------------------------------------------------------------------------------------
  - id: PARSE-VUNITS-ACCEPTED
    status: active
    expires: 2027-06-30
    # MEASURED, not estimated: 964 rows, from a diff of baseline/1.4.3 against the working tree on
    # 2026-07-31. It decomposes as 790 REG (= 158 registry defs carrying +vunits, x 5 probes)
    # + 144 CSV rows (whose source or target def carries +vunits) + 30 SYN (the mod/<host>/vunits_m
    # sweep, 6 hosts x 5 probes).
    #
    # NOTE FOR THE RECORD: the plan and the task brief both quote a smaller number -- "943 rows:
    # 158 registry defs x 5 probes + 143 CSV rows" (which is 933, not 943) and "expected_rows: 944".
    # Neither matches, for two reasons that are properties of THIS input set rather than errors in
    # theirs: the CSV side is 144 rows here, not 143, and neither figure includes the synthetic
    # +vunits modifier sweep, which did not exist when those numbers were written. 964 is what the
    # suite measures; if a future run disagrees, that is a COUNT_MISMATCH to investigate, not a
    # number to relax.
    # RE-PINNED 2026-08-01 by the FAILCLOSED-NAD27-OUTSIDE-GRID-REPORTED stream, which is
    # ordered first in this file. 8 of this rule's rows are +datum=NAD27 CRS whose transform
    # now raises COORDINATE_OUTSIDE_GRID instead of returning a coordinate, so they have no
    # numeric movement left for this rule to describe and that rule claims them. The mechanism
    # this rule states is unchanged and is still true of the 956 that remain; only the
    # population it applies to shrank. Verified on a frozen A/B, and the arithmetic is
    # itemised in that rule's reason.
    # RE-PINNED 2026-08-01 by the GRIDS-EPSG-SHIP-CONUS stream: proj4j-epsg now ships PROJ
    # 9.8.1's `conus` at proj4/nad/conus, so the golden run resolves that grid for the first
    # time (golden depends on proj4j-epsg and, unlike core's own tests and the conformance
    # module, has no other copy on its classpath). Measured on a frozen /tmp A/B whose two
    # trees differ in exactly one byte-bearing file, the grid itself. +6, the same mechanism: rows whose transform now completes have movement to attribute.
    expected_rows: 962
    reason: |
      Proj4Keyword has no `vunits`, so Proj4Parser rejected the ENTIRE definition of any CRS carrying
      it with UnsupportedParameterException -- 158 registry defs, all of them unreachable. PROJ has no
      parameter allow-list at all (src/init.cpp retains every token in a paralist and recognition is
      pull-based via pj_param), and test/gie/builtins.gie relies on that: it feeds a literal
      `unknown_keyword` token and expects it to be ignored. Accepting +vunits is a step toward
      ParseMode.PROJ_COMPATIBLE. Every one of these rows moves from "exception" to "a coordinate",
      which is why the rule allows a status change and non-finite baseline values: the baseline row is
      all-NaN by construction.
    match:
      classifications: [CHANGED]
      params_present: [vunits]
      status_from: "EXC:org.locationtech.proj4j.UnsupportedParameterException"
      status_to: "OK"
    expect:
      dimensions: [fx, fy, fz, ix, iy, iz]
      allow_status_change: true
      allow_inside_change: true
      allow_nonfinite: true

  # ---------------------------------------------------------------------------------------------
  - id: PARSE-NO-KEYWORD-ALLOWLIST
    status: active
    expires: 2027-06-30
    # PINNED at 100 on 2026-08-01 (late triage) = 18 SYN keys x 5 probes + world:malay x 5 +
    # world:madagascar x 5. It was TBD at 95 while the parser stream was landing; that stream
    # has landed (Proj4Keyword and ParseMode.PROJ_COMPATIBLE are unchanged across two frozen
    # snapshots taken hours apart) and this count is now a tripwire on it: every further token
    # that stops being rejected adds 5 or 10 rows here and the gate will say so.
    expected_rows: 100
    reason: |
      The generalisation of PARSE-VUNITS-ACCEPTED, which is above and claims the +vunits subset
      first. parser/Proj4Parser.java:79 now consults Proj4Keyword's allow-list only in
      ParseMode.STRICT, and :62 makes ParseMode.PROJ_COMPATIBLE the default, so an unrecognised
      token no longer rejects the whole definition.

      That is upstream's behaviour and not a relaxation: PROJ has no parameter allow-list at all.
      9.8.1:src/init.cpp retains every token in a paralist and recognition is pull-based through
      pj_param, and test/gie/builtins.gie depends on it -- it feeds a literal `unknown_keyword`
      token and asserts the coordinate is unaffected. The synthetic matrix probes that same token
      on purpose (`mod/<host>/unknown_keyword`), which is why this rule's row set is dominated by
      three modifiers rather than by real CRS: `e`, `vto_meter` and `unknown_keyword`, each over
      the 6 hosts aea/lcc/longlat/merc/tmerc/utm. The one registry def is world:malay, whose
      baseline message is `rot_conv parameter is not supported`.

      Every claimed row moves from "the definition was rejected" to "a coordinate", so the
      baseline side is all-NaN by construction and the rule cannot hide a numeric regression;
      that is also why it allows a status change, an inside change and non-finite endpoints, with
      no magnitude band (there is no meaningful band against NaN).

      WHY THIS RULE IS SCOPED BY KEY AND NOT BY status_from ALONE. It was first written as just
      `status_from: UnsupportedParameterException, status_to: OK`, and the gate caught it
      immediately: it claimed 270 rows instead of 95 and PARSE-R-DECLARES-SPHERE dropped from 250
      to 75. The 175 rows it had taken were `mod/<host>/R*`, where 1.4.3 rejected `+R_A` and its
      siblings as unsupported parameters, so the row moves from an exception to a coordinate AND
      that coordinate is the one the +R sphere-declaration fix changed. A rule shaped like that
      would have absorbed the entire +R numeric change behind a parse-acceptance reason, which is
      precisely the laundering this file's expect clauses and ordering rules exist to prevent.
      Naming the three tokens instead makes the rule say what it means, and makes a fourth
      accepted token show up as UNEXPLAINED rather than be swallowed.

      world:madagascar, ADDED 2026-08-01 (late triage), AND WHY IT WAS RIGHT TO REFUSE IT
      BEFORE. This rule previously said, in this paragraph: "world:madagascar (5 rows), whose
      +rot_conv is now accepted but which then fails with `Unknown projection: labrd` -- an
      UnsupportedParameterException became an InvalidValueException. It is still broken, for a
      different reason, and calling that 'intended' would launder an unimplemented projection
      into a declared change." That was correct at the time and is now spent: labrd is
      implemented (see PROJ-NEW-PROJECTIONS-REGISTERED, whose 44-name list now carries it), so
      the row set is `EXC:UnsupportedParameterException: crs-tgt: azi parameter is not
      supported` -> `OK`, which is precisely this rule's predicate. The definition is
      `proj=labrd lat_0=-18d54 lon_0=46d26'13.95" azi=18d54 k_0=0.9995 x_0=400000 y_0=800000`;
      `azi` is a real 9.8.1 parameter (`src/projections/labrd.cpp` reads `+azi`) that
      Proj4Keyword did not list, which is the same defect as `+vunits`.

      Note that TWO changes had to land for these five rows to move, and this rule only speaks
      for one of them -- it says the definition is no longer rejected at parse time. It makes no
      claim about the Laborde coordinates now produced; that is gie's question and
      PROJ-NEW-PROJECTIONS-REGISTERED's paragraph on the same point applies verbatim. The same
      split already exists in this file for world:malay, whose +rf dependency is noted under
      PARSE-RF-IN-WORLD-DICTIONARY.

      ONE ROW SET IT STILL DOES NOT CLAIM:
        * SYN proj/alsk, proj/apian, proj/bacon (15 rows), which moved the other way,
          InvalidValueException -> UnsupportedParameterException. They belong to whoever owns
          the parse-error taxonomy. (proj/alsk has since been claimed by
          PROJ-NEW-PROJECTIONS-REGISTERED and proj/apian and proj/bacon by
          FAILCLOSED-NO-INVERSE-FOR-NEW-FORWARD-ONLY, each on its own mechanism -- which is what
          leaving them here rather than absorbing them made possible.)
    match:
      classifications: [CHANGED]
      keys: ["mod/*/e", "mod/*/unknown_keyword", "mod/*/vto_meter", "world:malay",
             "world:madagascar"]
      status_from: "EXC:org.locationtech.proj4j.UnsupportedParameterException"
      status_to: "OK"
    expect:
      dimensions: [fx, fy, fz, ix, iy, iz]
      allow_status_change: true
      allow_inside_change: true
      allow_nonfinite: true

  # ---------------------------------------------------------------------------------------------
  - id: PARSE-DMS-PARAMETER-VALUE
    status: active
    expires: 2027-06-30
    # PINNED at 8, measured 2026-08-01 on a frozen /tmp snapshot (rsync of the working tree, so no
    # other stream could move under the run). Two independent sources agree, which is why 8 is
    # trusted: the gate's own `rows claimed per rule`, and FAILCLOSED-NAD27-OUTSIDE-GRID-REPORTED's
    # separately written arithmetic, which predicts "PARSE-DMS-PARAMETER-VALUE 10 -> 8 (-2)".
    #
    # 8 AND NOT THE STRUCTURAL 10, and the two missing rows are attribution rather than theft.
    # nad27:5001 probes 1 and 3 now end at EXC:CrsTransformException -- the DMS fix let them parse,
    # and the transform then found them outside every NAD27 grid. This rule's `status_to: "OK"`
    # excludes that outcome deliberately, so reordering the rules would NOT bring them here; the
    # predicate declines them whatever the order. Verified on the frozen report: nad83:5001 x5 plus
    # nad27:5001 probes 0, 2, 4.
    expected_rows: 8
    reason: |
      1.4.3 read angular parameter values with Double.parseDouble and let the resulting
      java.lang.NumberFormatException escape -- NOT a Proj4jException, so it went through every
      `catch (Proj4jException)` in the library and in every caller. Two registry defs trip it:
      nad27:5001 and nad83:5001 (Alaska zone 1, +proj=omerc) carry
      `alpha=-36d52'11.6315`, DMS with the seconds mark omitted. The baseline message is the raw
      `For input string: "-36d52'11.6315"`.

      parser/Proj4Parser.java:574-587 now routes angular values through Angle.parse plus PROJ's
      r/R radian suffix and wraps any NumberFormatException in an InvalidValueException, which is
      both what upstream accepts (dmstor, 9.8.1:src/dmstor.cpp, is applied to every angular
      parameter) and what the error taxonomy requires. These two defs consequently parse and
      transform for the first time.

      Scoped by key rather than by status_from alone: `EXC:java.lang.NumberFormatException` is a
      status that could in principle appear from a completely unrelated raw parse escape, and this
      rule should not be the thing that explains the next one. Baseline is all-NaN by
      construction, hence the status/inside/non-finite allowances and no magnitude band.
    match:
      classifications: [CHANGED]
      sections: [REG]
      keys: ["nad27:5001", "nad83:5001"]
      status_from: "EXC:java.lang.NumberFormatException"
      status_to: "OK"
    expect:
      dimensions: [fx, fy, fz, ix, iy, iz]
      allow_status_change: true
      allow_inside_change: true
      allow_nonfinite: true

  # ---------------------------------------------------------------------------------------------
  - id: FAILCLOSED-NO-SUCH-ELEMENT-REPLACED
    status: active
    expires: 2027-06-30
    # PINNED at 50, and structural rather than incidental: 6 hosts x 5 probes for `h` plus 4 hosts
    # x 5 probes for `south`. `mod/tmerc/south` and `mod/utm/south` are absent because
    # TransverseMercatorProjection overrides setSouthernHemisphere; if a fifth or sixth host
    # acquires the override, or a host loses it, the count moves and the gate says so. Measured
    # 2026-08-01 on a frozen tree.
    expected_rows: 50
    reason: |
      THIS IS THE DEFECT THIS REGIME COULD NOT SEE, NOW MADE VISIBLE. golden/README.md's
      "non-Proj4jException escapes" section records these 50 rows as throwing
      `java.util.NoSuchElementException` in the baseline AND in the current run, and draws the
      correct conclusion: "this regime reports changes, so a defect that predates the baseline is
      exactly what it cannot see." Projection.setSouthernHemisphere and
      Projection.setHeightOfOrbit threw a bare NoSuchElementException -- not a Proj4jException,
      and with no message at all -- for any projection that does not implement them, so `+south`
      or `+h` on such a projection escaped every `catch (Proj4jException)` in the library and in
      every caller, and it had done so since before 1.4.3.

      The current side is now UnsupportedParameterException, a Proj4jException, with a message
      naming the parameter, the projection name and the implementing class:
      `+h=3.5785831E7 is not supported by projection aea
      (org.locationtech.proj4j.proj.AlbersProjection): it does not ...`. That is what makes the
      row change and therefore what makes it appear here for the first time.

      Both endpoints are exception rows, so both sides are all-NaN by construction and there is no
      numeric value for this rule to absorb. The `inside` column is `-` on both sides.

      ORDERED BEFORE PROJ-AEA-SPHERICAL-INVERSE ON PURPOSE. That rule matches `mod/aea/*` and
      would match `mod/aea/h` and `mod/aea/south` on section and key; today it declines them only
      because it does not set allow_status_change. golden/README.md already names relying on
      another rule's expect clause to decline as a silent coupling, so this rule claims its 10 aea
      rows first and says why, exactly as FAILCLOSED-UNCHECKED-ISE-REPLACED does for the two PAIR
      datum rules.
    match:
      classifications: [CHANGED]
      sections: [SYN]
      keys: ["mod/aea/h", "mod/lcc/h", "mod/longlat/h", "mod/merc/h", "mod/tmerc/h", "mod/utm/h",
             "mod/aea/south", "mod/lcc/south", "mod/longlat/south", "mod/merc/south"]
      status_from: "EXC:java.util.NoSuchElementException"
      status_to: "EXC:org.locationtech.proj4j.UnsupportedParameterException"
    expect:
      dimensions: [fx, fy, fz, ix, iy, iz]
      allow_status_change: true
      allow_nonfinite: true

  # ---------------------------------------------------------------------------------------------
  - id: PROJ-AEA-SPHERICAL-INVERSE
    status: active
    expires: 2027-06-30
    # PINNED at 159, measured 2026-08-01 on a frozen /tmp snapshot. Corroborated independently by
