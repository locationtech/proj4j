  - id: DATUM-TYPE-UNKNOWN-HOISTED
    status: active
    expires: 2027-06-30
    # PINNED at 251, measured 2026-08-01 on a frozen /tmp snapshot. golden/README.md's 253 is an
    # earlier snapshot and is superseded.
    #
    # THE ARITHMETIC, because this is the one TBD rule with no predicted count written anywhere and
    # so the one whose pin needed its own derivation. 347 changed PAIR rows carry a `t0*/*` or
    # `t*0/*` key: 251 land here, 16 are claimed earlier by FAILCLOSED-UNCHECKED-ISE-REPLACED, and
    # 80 are UNEXPLAINED. The 16 are NOT lost to an ordering accident -- every one is a status
    # change (IllegalStateException -> ProjectionException) and the `expect` clause below does not
    # set allow_status_change, so this rule declines them wherever it sits in the file. Checked on
    # the frozen report rather than inferred.
    expected_rows: 251
    reason: |
      BasicCoordinateTransform.java:198-205 nests the TYPE_UNKNOWN early-return INSIDE an
      ellipsoid-equality guard, so it is only consulted when the ellipsoids already match. The file
      itself cites PROJ 5.2.0:src/pj_transform.c, which checks it unconditionally and BEFORE the
      identical-datums short cut:

          if (src->datum_type == PJD_UNKNOWN || dst->datum_type == PJD_UNKNOWN) return 0;

      Consequence in 1.4.3: for a bare-+ellps pair with differing ellipsoids and TYPE_UNKNOWN datums,
      proj4j falls through to a geocentric round trip that PROJ skips entirely. Hoisting the check
      restores PROJ's answer for every such pair.

      The PAIR key encodes the two datum types (`t<src><tgt>/`), so this rule is scoped by key glob to
      pairs with TYPE_UNKNOWN (type 0) on either end -- which is exactly the predicate the upstream
      OR-guard tests. It is ordered before the isEqual rule because the hoist changes whether
      isEqual is even reached.

