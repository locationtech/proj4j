  - id: NUM-PHI2-CONVERGES-ON-EXTREME-ELLIPSOIDS
    status: active
    expires: 2027-06-30
    # PINNED at 6, measured 2026-08-01 on a frozen /tmp snapshot: `ellps/NWL9D` probes 1..4 and
    # `ellps/andrae` probes 3..4. The split is 4 + 2 rather than 5 + 5 because the other probes of
    # those two keys converged in 1.4.3 too.
    #
    # THE COUNT IS DATA-DRIVEN, NOT STRUCTURAL -- it depends on where the iteration happened to fall
    # short, so any further change to the auxiliary-latitude core moves it. That was the stated
    # reason for leaving it TBD, and it is exactly backwards: a count that moves for reasons nobody
    # predicted is the count most worth pinning. When the numerical core next changes this rule will
    # fail with a COUNT_MISMATCH naming itself, which is a two-line re-pin and a sentence of
    # explanation -- against a TBD, which would have said nothing at all.
    expected_rows: 6
    reason: |
      `EXC:ConvergenceFailureException: inv: Computation of phi2 failed to converage after 15
      iterations` -> `OK`. (The baseline message's spelling is upstream-of-us and reproduced
      verbatim, as this suite reproduces every baseline string.)

      1.4.3's `phi2` was a fixed-point iteration capped at 15 trips with no error-term acceleration,
      and on the two most eccentric entries of `ellps.cpp` it ran out of trips. 9.8.1's rewritten
      `src/phi2.cpp` -- the Karney formulation this project ports, measured at 4,145 nm -> 2.1 nm at
      GRS80, see NUM-KARNEY-LATITUDE-CORE -- converges there.

      WHY THIS IS A SEPARATE RULE FROM NUM-KARNEY-LATITUDE-CORE, which is the rule that would
      otherwise own the phi2 work: that rule refuses status changes and non-finite endpoints on
      purpose, so it cannot claim a row whose baseline side is an exception, and it should not be
      loosened to do so -- its whole value is that it can only absorb sub-microscopic drift. These
      six rows are the same code change observed at its most visible, and they need their own
      statement.

