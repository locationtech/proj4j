  - id: PROJ-AITOFF-HAMMER-WINTRI-INVERSES-LANDED
    status: active
    expires: 2027-06-30
    # PINNED at 13, and the 13 rather than 15 is the shape of the defect, not a shortfall:
    # `proj/hammer` contributes 5, `proj/aitoff` and `proj/wintri` 4 each, because probe 0 sits
    # at the canonical `+lon_0=10 +lat_0=45` origin where an inverse that is 20 degrees wrong in
    # longitude still returns the right longitude -- the offset from centre is zero. Those two
    # probe-0 rows do move, by 1.4e-14 and 7.1e-15 degrees, and are claimed by
    # NUM-KARNEY-LATITUDE-CORE. If either ever exceeds this rule's 1e-6 floor the count goes to
    # 14 or 15 and the gate asks why, which is the correct behaviour.
    expected_rows: 13
    reason: |
      THE THREE PROJECTIONS THAT LEFT FAILCLOSED-NO-INVERSE-FOR-FORWARD-ONLY'S LIST BY GAINING
      AN INVERSE. That rule's `expected_rows` note has the upstream citations
      (`aitoff.cpp:200-201` is the shared setup for both `aitoff` and `wintri`;
      `hammer.cpp:86-87`); this rule is what happens to their rows instead.

      All three are `OK -> OK`, and what moved is checkable rather than asserted: `ix`/`iy` now
      return the COMMITTED PROBE, which `probes.tsv` puts at longitude
      10 / -11.2132034 / 31.2132034 and latitude 45 / 30 / 60. Before, 1.4.3's
      `Projection.projectInverse` identity ran instead of a real inverse and handed the
      projected metres back as radians:

        proj/aitoff  probe 1  ix -9.22985069 -> -11.2132034, iy 30.1588659 -> 30
        proj/hammer  probe 3  ix -2.21244256 -> -11.2132034, iy 57.4596376 -> 60
        proj/wintri  probe 3  ix -3.15241418 -> -11.2132034, iy 60.1122467 -> 60

      AITOFF AND HAMMER MOVE ONLY IN THE INVERSE. Their forwards are unchanged to the last
      digit at every probe except a 1-ULP flicker on `fx` at probe 2 (2140657.19 and
      2113536.36, same to nine digits), so on those two keys this rule is as safe as
      PROJ-INVERSE-CORRECTED-ROUND-TRIP-NOW-EXACT's `dimensions: [ix, iy, iz]` clause.

      WINKEL TRIPEL'S FORWARD ALSO MOVED, AND THE ARITHMETIC IS EXACT, WHICH IS WHY IT IS IN
      THIS RULE RATHER THAN LEFT UNEXPLAINED. `proj/wintri` probe 1 moves `fx`
      -1,821,999.25 -> -2,092,863.41 m. Upstream's Winkel Tripel is the mean of the Aitoff and
      an equirectangular on the standard parallel, `x = (x_aitoff + lam * cos(phi_1)) / 2`, and
      9.8.1:src/projections/aitoff.cpp:217-234 -- `PJ_PROJECTION(wintri)` -- reads `+lat_1`
      when it is present and only falls back to `cosphi1 = 0.636619772367581343` (which is
      2/pi, i.e. phi_1 = 50d28', Bartholomew's parallel) when it is ABSENT. 1.4.3 hard-coded
      the 2/pi and ignored `+lat_1` entirely. The canonical synthetic set carries `+lat_1=30`,
      so:

        lam = -21.2132034 deg = -0.370246 rad ;  a = 6378137
        x_aitoff                    = -2,140,657.19          (unchanged, and observable in the
                                                              proj/aitoff row above)
        a * lam * cos(30 deg)       = -2,045,069.6           <- the current build
        a * lam * (2/pi)            = -1,503,347             <- what 1.4.3 used
        (x_aitoff + -2,045,069.6)/2 = -2,092,863.4  = the current fx, to the digit
        (x_aitoff + -1,503,347)/2   = -1,822,002    = the baseline fx, to the digit

      Both halves of that check reproduce a MEASURED value from a formula, in both directions,
      so the mechanism is confirmed rather than plausible.

      Band 1e-6 .. 1e6: the floor keeps this rule out of NUM-KARNEY-LATITUDE-CORE's band (and
      is what leaves the two probe-0 rows there), the ceiling is above the largest observed
      movement of 2.71e5 (metres on `fx`; the `ix`/`iy` movements are degrees -- see the units
      warning at the top of this file -- and the largest of those is 8.4 degrees).
    match:
      classifications: [CHANGED]
      sections: [SYN]
      keys: ["proj/aitoff", "proj/hammer", "proj/wintri"]
      status_from: "OK"
      status_to: "OK"
    expect:
      dimensions: [fx, fy, fz, ix, iy, iz]
      magnitude: {min: 1.0e-6, max: 1.0e6}

