  - id: PROJ-INVERSE-CORRECTED-ROUND-TRIP-NOW-EXACT
    status: active
    expires: 2027-06-30
    # PINNED at 48, measured 2026-08-01 on a frozen /tmp snapshot, across 11 keys:
    #   SYN proj/bipc 5 · collg 5 · fahey 5 · lsat 5 · euler 4 · murd1 4 · murd2 4 · murd3 4
    #   · pconic 4 · vitk1 4 · REG esri:54026 4
    # Data-driven, not structural: six keys contribute 4 rows and not 5 because their probe 0 sits
    # at the CRS origin, where the broken inverse happened to be right. `core/proj/**` is still
    # live, so this number is expected to move -- and that is the argument FOR the pin, not against
    # it. A projection stream that changes it gets a COUNT_MISMATCH naming this rule; a TBD would
    # have let the row set change size in silence.
    expected_rows: 48
    reason: |
      THE STRONGEST EVIDENCE THIS REGIME CAN PRODUCE SHORT OF A ROW RETURNING TO BASELINE, and the
      `expect.dimensions` clause is what makes it safe.

      Every claimed row moves ONLY in the inverse columns -- `dimensions: [ix, iy, iz]` -- so the
      forward output is bit-identical to 1.4.3 on all 48. A rule that cannot touch `fx`, `fy` or
      `fz` cannot hide a forward regression; if a future change moves a forward ordinate on any of
      these rows the rule DECLINES it and the row reappears as UNEXPLAINED. That is the entire
      reason this cluster can be ruled while its files are still being written.

      And what the inverse columns move TO is checkable rather than asserted: the committed probe
      coordinate, to nine digits. `probes.tsv` puts the canonical synthetic probes at longitude
      10 / -11.2132034 / 31.2132034 and latitude 45 / 30 / 60, and that is precisely what `ix`/`iy`
      now return. Before, they returned something else entirely:

        SYN proj/lsat   probe 0  ix 136.758446215 -> 10.000000230, iy -56.0683414 -> 45
                        probes 1 and 3 also recorded ix = 136.758446215 -- the SAME value at two
                        different probes, which is the tell: it is the +-pi longitude clamp, not a
                        coordinate. LandsatProjection.projectInverse was ENTIRELY INSIDE A BLOCK
                        COMMENT, so Projection.projectInverse's unconditional identity ran instead,
                        and Projection.inverseProjectRadians CLAMPED longitude to +-pi where
                        9.8.1 WRAPS with adjlon (src/inv.cpp, via pj_adjlon).
        SYN proj/collg  iy -31.0082524 -> 45,   -40.5142342 -> 30,   -20.9717108 -> 60
        SYN proj/fahey  iy  24.7638938 -> 45,    43.6824137 -> 30,    -5.90746223 -> 60
        SYN proj/euler  ix -167.926368 -> -11.2132034  (a 156-degree error)
        SYN proj/murd1  ix -165.517234 -> -11.2132034
        SYN proj/murd2, murd3, pconic, vitk1: the same shape, 149..168 degrees out
        SYN proj/bipc   ix  16.3737802 -> 10,    iy -20.6736053 -> 45
        REG esri:54026  ix 0 -> -5 and iy 0 -> -5 at a probe of (-5, -5): the inverse returned the
                        ORIGIN for all four corners, a sentinel wearing a coordinate's clothes.

      Six of the eleven keys are the `SimpleConicProjection` family (euler, murd1, murd2, murd3,
      pconic, vitk1) and their three shared defects; `lsat` is the Landsat/SOM fix above; `collg`,
      `fahey`, `bipc` and `esri:54026` are the `builtins` numerical batch.

      Note that four keys contribute 4 rows rather than 5, and the missing row is probe 0 in every
      case -- the CRS centre, where an inverse that is 156 degrees wrong in longitude still returns
      the right answer because the longitude offset from centre is zero. That asymmetry is a
      property of the defect and is why the count is data-driven; see the expected_rows note.

      Units: `ix`/`iy` are always WGS84 degrees (golden/README.md's units warning), so the
      magnitudes here -- 1e-4 .. 665 -- are degrees. The floor of 1e-6 exists only to keep this
      rule from reaching into NUM-KARNEY-LATITUDE-CORE's band; nothing observed is near it.
    match:
      classifications: [CHANGED]
      keys: ["proj/bipc", "proj/collg", "proj/euler", "proj/fahey", "proj/lsat", "proj/murd1",
             "proj/murd2", "proj/murd3", "proj/pconic", "proj/vitk1", "esri:54026"]
      status_from: "OK"
      status_to: "OK"
    expect:
      dimensions: [ix, iy, iz]
      magnitude: {min: 1.0e-6, max: 1.0e4}

