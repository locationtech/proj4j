  - id: PARSE-UNITS-PRECEDES-TO-METER
    status: active
    expires: 2027-06-30
    # PINNED at 17, measured 2026-08-01 on a frozen /tmp snapshot: mod/merc/to_meter 5,
    # mod/lcc/to_meter 4, mod/tmerc/to_meter 4, mod/utm/to_meter 4. The three 4s are probe 0 landing
    # exactly on the false origin in both trees, where a scale factor is invisible.
    # `mod/aea/to_meter` is claimed earlier by PROJ-AEA-SPHERICAL-INVERSE and `mod/longlat/to_meter`
    # does not move (a geographic target does not apply `to_meter`). Every term of 5 + 4 + 4 + 4 is
    # therefore accounted for, which is what makes 17 safe to pin while the parser stream is live.
    expected_rows: 17
    reason: |
      A CORRECTION TO PARSE-FIRST-MATCH-WINS' REASON, WHICH SAYS "EXACTLY FOUR OF THE 47 MODIFIERS
      COLLIDE WITH A CANONICAL KEY". Four collide by KEY. A fifth collides by MEANING, and it is
      `to_meter` against the canonical set's `+units=m`.

      9.8.1:src/init.cpp:681-691, and the short circuit is the whole mechanism:

          if ((name = pj_param(ctx, start, "sunits").s) != nullptr) {   /* :681 */
              ...
              s = units[i].to_meter;                                   /* :689 */
          }
          if (s || (s = pj_param(ctx, start, "sto_meter").s)) {         /* :691 */

      Because `s` is already non-null when `+units` was given, the `||` never evaluates its right
      operand and `+to_meter` is NOT CONSULTED AT ALL. `+units=m` therefore wins over any
      `+to_meter`, whichever order they appear in -- this is not first-match-wins on a paralist, it
      is one parameter shadowing another, and the two mechanisms deserve separate rules even though
      one stream fixed both.

      MEASURED EXACTLY, not inferred. `SYN mod/merc/to_meter` probe 0: `fy` 18,344,146.7 ->
      5,591,295.92, and 18,344,146.7 / 5,591,295.92 = 3.280839895... = 1 / 0.3048 on every one of
      the 17 rows. So 1.4.3 divided by the appended `+to_meter=0.3048` (emitting feet) and the
      current build ignores it (emitting metres, per the canonical `+units=m`). The direction is
      the one upstream specifies.

      Units: `fx`/`fy` are the target's units and that is the point of the row -- the baseline is
      in feet and the current value is in metres. The 1e6 floor is ten orders of magnitude above
      the sub-millimetre transverse-Mercator drift that also touches `mod/tmerc/to_meter` and
      `mod/utm/to_meter`, so this rule explains the unit flip and vouches for nothing else.
    match:
      classifications: [CHANGED]
      sections: [SYN]
      keys: ["mod/lcc/to_meter", "mod/merc/to_meter", "mod/tmerc/to_meter", "mod/utm/to_meter"]
    expect:
      dimensions: [fx, fy, fz, ix, iy, iz]
      magnitude: {min: 1.0e6, max: 1.0e8}

